[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scholialang-mcp"
version = "0.7.2"
description = "MCP, LSP, and host-plugin tooling for Scholia — preserve agent reasoning state and reduce context cost across long-horizon work"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{name = "Doug Fir Labs"}]
dependencies = [
    "scholialang>=0.7.2,<0.8",
]
keywords = ["scholia", "scholialang", "mcp", "lsp", "agents"]

[project.optional-dependencies]
claude = []
codex = []
ollama = []
openai = []
all = []
dev = [
    "pytest>=8.1.1",
    "pytest-timeout>=2.0",
]

[project.urls]
Homepage = "https://github.com/dougfirlabs/scholialang-mcp"
Repository = "https://github.com/dougfirlabs/scholialang-mcp"
Specification = "https://github.com/dougfirlabs/scholialang-spec"

[project.scripts]
scholialang-mcp = "scholialang_mcp.server:main"
scholialang-lsp = "scholialang_mcp.lsp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
consider_namespace_packages = true
pythonpath = ["."]
testpaths = [
    "tests",
    "plugins/codex/scholialang/tests",
    "plugins/claude-code/scholialang/tests",
    "plugins/ollama/scholialang/tests",
]
timeout = 10
timeout_method = "signal"
